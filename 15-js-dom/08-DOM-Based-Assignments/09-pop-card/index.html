<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../09-pop-card/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Pop-pup</title>
</head>

<body onload="visiblePop()">
    <div id="circle" class="circle">
        <i class="fa-regular fa-circle-check fa-beat"></i>  
    </div>
    <div id="card" class="card">
        <h1>Thank You !</h1>
        <h2>Your details has been successfully submitted, Thanks!</h2>
        <button onclick="closePop()" >Ok</button>
    </div>
    <button id="doneBTN" onclick="visiblePop()" class="doneBTN">Done  <i class="fa-solid fa-circle-check"></i></button>
    <script src="../09-pop-card/script.js"></script>
</body>

</html>
