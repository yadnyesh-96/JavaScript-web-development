<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM slectors </title>
</head>
<body>
    <h1 id="title">Hello Js Learnrs</h1>
    <p class="info">Paragraph and learning materials</p>
</body>
    <script>
        const title=document.querySelector("#title");
        const info = document.querySelector(".info");

        console.log(title.textContent);        // Hello Js Learnrs
        console.log(info.textContent);      // Paragraph and learning materials
    </script>
</html>
