<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM selector</title>
</head>
<body>
    <p>One</p>
    <p>Two</p>
</body>
<script>
    const paragraph =document.querySelectorAll("p");
    paragraph.forEach(p=>{
        console.log(p.textContent);
    });
</script>
</html>
