<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Style</title>
    <style>
        .active{
            background-color: green;
            color: white;
        }
    </style>
</head>
<body>
    <button id="btn">Click</button>
</body>
    <script>
        const btn = document.getElementById("btn");

        btn.classList.add("active");
    </script>
</html>
