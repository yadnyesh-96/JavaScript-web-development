
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Async Calculator</title>
</head>
<body>
    
    <h1>Smart Async Calculator</h1>

    <input type="number" name="" id="num1" placeholder="First number" />

    <select name="" id="operator">
        <option value="+">+</option>
        <option value="-">-</option>
        <option value="*">*</option>
        <option value="/">÷</option>
    </select>

    <input type="number" name="" id="num2" placeholder="Second number" />

    <br /><br />

    <button id="calcBtn">Calculate</button>

    <p id="status"></p>
    <p id="result"></p>

    <script src="./script.js"></script>
</body> 
</html>
